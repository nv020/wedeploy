<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Kandidaatprofiel | Wedeploy</title>
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/kluis-test/vault.css">
  <script type="module" src="/kluis-test/vault.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="https://www.wedeploy.nl" aria-label="Wedeploy home"><img src="/favicon.svg" alt=""> Wedeploy</a>
    <span class="tag">Testomgeving</span>
  </header>
  <main>
    <section class="intro">
      <p class="eyebrow">Kandidaatintroductie</p>
      <h1>Pentester <span>Netwerken &amp; Active Directory</span></h1>
      <p class="description">Een korte kennismaking met een fictief kandidaatprofiel. Open de kluis om het testdocument te downloaden.</p>
      <div class="actions">
        <button type="button" id="open" disabled>Open profiel <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8 4l4 4-4 4"/></svg></button>
        <button type="button" id="download" hidden>Download profiel <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8m-3-3 3 3 3-3M3 13h10"/></svg></button>
        <p id="status" role="status"></p>
      </div>
    </section>
    <figure class="illustration" aria-hidden="true">
      <div class="plinth">
        <div class="vault" id="vault">
          <div class="inside">
            <div class="sheet"><b>WD</b><i></i><i></i><i></i></div>
          </div>
          <div class="door">
            <div class="face">
              <span class="screw top-left"></span><span class="screw top-right"></span>
              <span class="screw bottom-left"></span><span class="screw bottom-right"></span>
              <span class="dial"><i></i></span>
              <span class="hinge hinge-top"></span><span class="hinge hinge-bottom"></span>
            </div>
            <div class="back"></div>
          </div>
          <div class="led"></div>
        </div>
      </div>
      <figcaption><span class="signal"></span><span id="vault-label">KLUIS GESLOTEN</span></figcaption>
    </figure>
  </main>
  <footer>
    <span>Wedeploy · Fictief testprofiel</span>
    <span>Bezoek, openen en downloaden worden per uitnodiging geregistreerd.</span>
  </footer>
</body>
</html>
